<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DGM Apps</title>
    <meta name="description" content="App utili e semplici pensate per farti risparmiare tempo: Kado AI, Bricolo AI, Forma AI." />

    <!-- Open Graph / Twitter Card -->
    <meta property="og:title" content="DGM Apps" />
    <meta property="og:description" content="App utili e semplici pensate per farti risparmiare tempo: Kado AI, Bricolo AI, Forma AI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DGM Apps" />
    <meta name="twitter:description" content="App utili e semplici pensate per farti risparmiare tempo: Kado AI, Bricolo AI, Forma AI." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DGM Apps" />
    <meta name="theme-color" content="#07070B" />
  </head>
  <body>
    <!-- Primo disegno senza aspettare il JavaScript.
         Misurato su 3G lento: la pagina restava NERA per 3,4 secondi,
         perche' il primo elemento dipinto era il nome dell'app, cioe'
         qualcosa che React puo' disegnare solo dopo aver scaricato ed
         eseguito 116 KB compressi. Qui c'e' il fondo e il marchio,
         scritti a mano nell'HTML: arrivano con la pagina.
         Sta nella STESSA posizione dell'intestazione vera, quindi quando
         React monta non si sposta niente. Nessun testo tradotto: il
         marchio e' uguale in tutte le lingue, e indovinare la lingua qui
         vorrebbe dire mostrarne una sbagliata a chi non parla italiano. -->
    <div id="guscio" aria-hidden="true" style="position:fixed;inset:0;z-index:0;background:#08070A;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
      <div style="display:flex;align-items:center;gap:10px;height:64px;padding:0 16px;max-width:72rem;margin:0 auto">
        <span style="width:26px;height:26px;border-radius:999px;background:radial-gradient(circle at 30% 30%,#FF2E7E,#FF8A1F 55%,#38F27A)"></span>
        <span style="color:#fff;font-weight:800;letter-spacing:-0.01em;font-size:15px">DGM APPS</span>
      </div>
    </div>
    <div id="root" style="position:relative;z-index:1"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
