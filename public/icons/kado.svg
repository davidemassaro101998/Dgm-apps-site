<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D7F" />
      <stop offset="100%" stop-color="#FFB24D" />
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7A1030" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- iOS-style rounded app icon canvas, flat brand-coral -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#topHighlight)" />

  <!-- Gift box glyph, white on coral -->
  <g filter="url(#shadow)" transform="translate(256, 280)">
    <rect x="-118" y="-30" width="236" height="170" rx="20" fill="#FFFFFF" />
    <rect x="-134" y="-78" width="268" height="58" rx="16" fill="#FFFFFF" />

    <!-- Coral ribbon cut-outs -->
    <rect x="-26" y="-78" width="52" height="278" fill="#FF3D7F" />
    <rect x="-134" y="-60" width="268" height="22" fill="#FF3D7F" opacity="0.9" />

    <!-- Bow -->
    <path d="M 0,-78 C -50,-140 -104,-140 -72,-92 C -50,-60 0,-78 0,-78 Z" fill="#FFFFFF" />
    <path d="M 0,-78 C 50,-140 104,-140 72,-92 C 50,-60 0,-78 0,-78 Z" fill="#FFFFFF" />
    <circle cx="0" cy="-78" r="17" fill="#FFFFFF" />
  </g>
</svg>
