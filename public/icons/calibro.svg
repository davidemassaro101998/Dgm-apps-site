<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C8BFF" />
      <stop offset="100%" stop-color="#2F6BFF" />
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A1B47" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#topHighlight)" />

  <!-- Il calibro: la ganascia e le due aste graduate. Lo stesso glifo
       dell'app, ridisegnato pieno perche a 40px un tratto sottile
       sparisce. -->
  <g filter="url(#shadow)" fill="#0A0D14">
    <rect x="88" y="140" width="86" height="232" rx="26" />
    <rect x="196" y="182" width="228" height="34" rx="17" />
    <rect x="196" y="296" width="228" height="34" rx="17" />
    <rect x="372" y="140" width="34" height="60" rx="17" />
    <rect x="372" y="312" width="34" height="60" rx="17" />
  </g>
</svg>
