<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CDF548" />
      <stop offset="100%" stop-color="#8FE33A" />
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2E4D06" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#topHighlight)" />

  <!-- Dumbbell glyph, dark on lime -->
  <g filter="url(#shadow)" fill="#101505">
    <rect x="96" y="196" width="66" height="120" rx="20" />
    <rect x="350" y="196" width="66" height="120" rx="20" />
    <rect x="150" y="238" width="212" height="36" rx="18" />
  </g>
</svg>
