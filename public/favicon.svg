<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161F" />
      <stop offset="100%" stop-color="#07070B" />
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="logoRingA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="logoRingB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>

  <!-- iOS-style rounded app icon canvas, dark/neutral (umbrella brand) -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#topHighlight)" />

  <!-- Two-ring DGM Apps mark, centered -->
  <circle cx="256" cy="256" r="112" fill="url(#logoGlow)" opacity="0.55" />
  <circle cx="185" cy="256" r="100" fill="none" stroke="url(#logoRingA)" stroke-width="26" />
  <circle cx="327" cy="256" r="100" fill="none" stroke="url(#logoRingB)" stroke-width="26" />
</svg>
