<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calibro AI</title>
<meta name="theme-color" content="#0A0D14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&display=swap">

<style>
:root{
  --bg-main:#0A0D14; --bg-header:rgba(10,13,20,.85);
  --bg-card:#121722; --bg-card-2:#171D2B;
  --text-main:#EEF2F8; --text-sub:#8B93A5; --text-dim:#5C6577;
  --border-card:rgba(255,255,255,.07);
  --brand:#3D7BFF; --brand-2:#6AA0FF; --brand-3:#9CC4FF;
  --brand-grad:linear-gradient(135deg,#2F6BFF 0%,#4C8BFF 55%,#7FB0FF 100%);
  --ok:#34D399; --warn:#FBBF24;
  --font-display:"Archivo",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;width:100vw;overflow:hidden;position:fixed;inset:0;margin:0;padding:0}
body{background:var(--bg-main);color:var(--text-main);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
[hidden]{display:none!important}

#shell{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;position:relative}

/* Testata alle misure delle sorelle: 52px minimi, non 66. */
.hd{flex:0 0 auto;padding:calc(var(--sat) + 9px) 16px 8px;display:flex;align-items:center;gap:10px;
  min-height:52px;background:var(--bg-header);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-card);z-index:5}
.hd__b{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--bg-card);
  display:flex;align-items:center;justify-content:center;border:1px solid var(--border-card)}
.hd__t{flex:1 1 auto;min-width:0}
/* Il nome come nelle sorelle: nome normale + «AI» nella tinta, in
   grassetto di sistema, non nel carattere display. */
.hd__n{font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.hd__n b{color:var(--brand);font-weight:900}
.hd__s{display:none}
/* Una pillola sola con la lingua in corso, non cinque affiancate: con
   cinque il nome dell'app veniva schiacciato contro il bordo. Le sorelle
   hanno esattamente questa forma -- pillola alta 34, angolo pieno,
   fondo scheda. L'elenco si apre sotto. */
.lang{flex:0 0 auto;position:relative}
.lang>button{height:34px;padding:0 11px;border-radius:999px;background:var(--bg-card);
  border:1px solid var(--border-card);color:var(--text-main);font-size:12px;font-weight:800;
  letter-spacing:.04em;display:flex;align-items:center;gap:5px}
.lang>button svg{color:var(--text-sub)}
.lang__m{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:88px;padding:4px;
  border-radius:14px;background:var(--bg-card-2);border:1px solid var(--border-card);
  box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column}
.lang__m button{min-height:40px;padding:0 12px;border-radius:10px;font-size:12.5px;font-weight:700;
  color:var(--text-sub);display:flex;align-items:center}
.lang__m button[aria-pressed="true"]{background:rgba(61,123,255,.16);color:var(--brand-3)}

.bd{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:18px 18px calc(var(--sab) + 22px)}
.bd::-webkit-scrollbar{width:0}
.pane{animation:up .3s cubic-bezier(.22,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

h1{font-family:var(--font-display);font-weight:800;font-size:27px;line-height:1.12;letter-spacing:-.025em;margin:0}
h2{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.015em;margin:0}
.sub{font-size:14.5px;color:var(--text-sub);margin:9px 0 0;line-height:1.45}
.kick{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-2);
  display:block;margin-bottom:9px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);
  display:block;margin:0 0 10px}

.sr{position:relative;margin:16px 0 6px}
.sr input{width:100%;min-height:56px;padding:15px 46px 15px 46px;font-size:16px;border-radius:16px;
  background:var(--bg-card);border:1px solid var(--border-card);color:var(--text-main);
  -webkit-appearance:none;appearance:none}
.sr input::placeholder{color:var(--text-dim)}
.sr input:focus{border-color:var(--brand);background:var(--bg-card-2)}
.sr__i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
.sr__v{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;color:var(--brand-2)}

/* Le schede: due colonne, 95px, angolo 20px, icona in un quadrato
   inciso. Sono le stesse misure di Kado, Bricolo e Forma -- prima erano
   quadrate su tre colonne con l'angolo a 18, e a fianco delle sorelle
   si vedeva che erano di un'altra app. */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:2px}
.cat{height:95px;border-radius:20px;background:var(--bg-card);border:1px solid var(--border-card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;
  transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.cat:active{transform:scale(.97)}
.cat:hover{border-color:var(--brand-3)}
.cat__i{width:40px;height:40px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  color:var(--brand);background:var(--bg-card-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.4)}
.cat__n{font-size:14px;font-weight:600;letter-spacing:-.01em;text-align:center;line-height:1.2;color:var(--text-main)}

/* La domanda al centro e il microfono grande: il gesto principale della
   famiglia. L'aura radiale dietro il tondo e' lo stesso dispositivo che
   hanno le altre tre, con la tinta di questa app. */
.dom{text-align:center;margin:2px 0 0}
.dom h1{font-size:19.2px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.dom p{font-size:14px;color:var(--text-sub);margin:4px 0 0}
.gesto{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 2px}
.mic{position:relative;width:80px;height:80px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;transition:transform .15s;background:var(--brand-grad);
  box-shadow:0 10px 28px rgba(61,123,255,.42)}
.mic:active{transform:scale(.95)}
.mic::before{content:"";position:absolute;inset:-55%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(61,123,255,.40),rgba(127,176,255,.14) 55%,transparent);
  filter:blur(18px)}
.mic svg{position:relative;color:#0A0D14}
.gesto__n{font-size:12px;font-weight:700;color:var(--brand-3)}

.row{display:flex;align-items:center;gap:13px;width:100%;padding:15px;border-radius:15px;
  background:var(--bg-card);border:1px solid var(--border-card);margin-bottom:9px;
  transition:transform .14s,border-color .14s}
.row:active{transform:scale(.985);border-color:var(--brand)}
.row__b{flex:1 1 auto;min-width:0}
.row__n{display:block;font-size:15.5px;font-weight:600;line-height:1.25}
.row__m{display:block;font-size:12.5px;color:var(--text-sub);margin-top:2px}
.row__a{flex:0 0 auto;color:var(--text-dim)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;
  padding:4px 9px;border-radius:20px;background:rgba(61,123,255,.14);color:var(--brand-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{padding:10px 15px;border-radius:22px;background:var(--bg-card);border:1px solid var(--border-card);
  font-size:14.5px;font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.chips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.obj{border-radius:18px;padding:16px;background:var(--bg-card-2);border:1px solid rgba(61,123,255,.28);
  margin-bottom:16px;position:relative;overflow:hidden}
.obj::before{content:"";position:absolute;inset:-40% 40% 55% -20%;
  background:radial-gradient(closest-side,rgba(61,123,255,.20),transparent);pointer-events:none}
.obj__m{font-size:12px;color:var(--brand-3);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.obj__n{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin-top:5px}
.obj__x{font-size:13px;color:var(--text-sub);margin-top:4px}

.pc{border-radius:18px;background:var(--bg-card);border:1px solid var(--border-card);
  padding:16px;margin-bottom:11px}
.pc__h{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.pc__i{flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:rgba(61,123,255,.12);
  display:flex;align-items:center;justify-content:center;color:var(--brand-2)}
.pc__t{flex:1 1 auto;min-width:0}
.pc__n{font-size:16px;font-weight:650;line-height:1.25}
.pc__w{font-size:12.5px;color:var(--text-sub);margin-top:2px}
.code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600;
  letter-spacing:.02em;color:var(--text-main);background:#0D1219;border:1px solid var(--border-card);
  border-radius:11px;padding:11px 13px;margin-bottom:9px;word-break:break-word}
.code b{color:var(--brand-3);font-weight:700}
.fit{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ok);margin-bottom:12px}
.fit span{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.pc__b{display:flex;gap:9px}
.buy{flex:1 1 auto;min-height:50px;border-radius:14px;background:var(--brand-grad);color:#fff;
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .14s;text-decoration:none}
.buy:active{transform:scale(.97)}
.bell{flex:0 0 auto;width:50px;min-height:50px;border-radius:14px;background:var(--bg-card-2);
  border:1px solid var(--border-card);display:flex;align-items:center;justify-content:center;color:var(--text-sub)}
.bell[aria-pressed="true"]{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4);color:var(--ok)}
.price{font-size:12.5px;color:var(--text-dim);margin-top:10px;text-align:center}

.mine{border-radius:16px;background:var(--bg-card);border:1px solid var(--border-card);padding:14px;margin-bottom:9px}
.mine__h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mine__n{font-size:15px;font-weight:650}
.mine__d{font-size:12.5px;font-weight:700;white-space:nowrap}
.mine__p{font-size:13px;color:var(--text-sub);margin-top:3px}
.due{color:var(--warn)} .far{color:var(--text-dim)} .now{color:var(--ok)}

.empty{text-align:center;padding:34px 10px;color:var(--text-sub)}
.empty b{display:block;color:var(--text-main);font-size:17px;font-weight:700;margin-bottom:6px}

.why{border-radius:16px;background:rgba(61,123,255,.08);border:1px solid rgba(61,123,255,.2);
  padding:14px 15px;font-size:13.5px;color:var(--text-sub);line-height:1.5;margin-top:4px}
.why b{color:var(--text-main)}

.foot{font-size:11.5px;color:var(--text-dim);line-height:1.5;margin-top:20px;text-align:center}

/* Niente barra a schede in fondo: le sorelle non ce l'hanno, tengono
   tutto nella testata. «I miei oggetti» diventa una campanella li'. */
.tabs{display:none}
.camp{flex:0 0 auto;position:relative;width:34px;height:34px;border-radius:50%;background:var(--bg-card);
  border:1px solid var(--border-card);display:flex;align-items:center;justify-content:center;color:var(--text-sub)}
.camp[aria-pressed="true"]{color:var(--brand-2);border-color:rgba(61,123,255,.45)}
.camp .n{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:9px;background:var(--warn);
  color:#000;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tabs button{flex:1 1 0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:10.5px;font-weight:600;color:var(--text-dim);letter-spacing:.02em}
.tabs button[aria-pressed="true"]{color:var(--brand-2)}
.tabs i{font-style:normal;position:relative}
.tabs .n{position:absolute;top:-3px;right:-9px;min-width:16px;height:16px;border-radius:9px;background:var(--warn);
  color:#000;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}

#splash{position:fixed;inset:0;z-index:60;background:var(--bg-main);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity .45s ease,visibility .45s}
#splash.via{opacity:0;visibility:hidden}
.sp__l{width:78px;height:78px;border-radius:24px;background:var(--brand-grad);display:flex;align-items:center;
  justify-content:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.sp__n{font-family:var(--font-display);font-weight:900;font-size:29px;letter-spacing:-.03em;
  animation:up .5s .16s cubic-bezier(.22,.7,.2,1) both}
.sp__c{font-size:13.5px;color:var(--text-sub);text-align:center;max-width:280px;
  animation:up .5s .26s cubic-bezier(.22,.7,.2,1) both}
</style>
</head>

<div id="shell">

const KEY="calibro.v1";
let S={lang:"it", linguaAperta:false, vista:"home", cat:null, marca:null, mod:null, cerca:"", miei:[]};

function salva(){ try{ localStorage.setItem(KEY,JSON.stringify({lang:S.lang,miei:S.miei})); }catch(e){} }
function carica(){
  try{
    const o=JSON.parse(localStorage.getItem(KEY)||"{}");
    if(T[o.lang]) S.lang=o.lang;
    if(Array.isArray(o.miei)) S.miei=o.miei
      .filter(function(m){return m&&m.k&&m.mod&&m.quando;})
      .map(function(m){return {k:m.k, mod:m.mod, i:Number.isInteger(m.i)?m.i:(+String(m.k).split("#")[1]||0), quando:m.quando};})
      .filter(function(m){return MODELLI.some(function(x){return x.marca+"|"+x.nome===m.mod;});});
  }catch(e){}
  if(!localStorage.getItem(KEY)){
    const l=(navigator.language||"it").slice(0,2).toLowerCase();
    if(T[l]) S.lang=l;
  }
}

const el=function(i){return document.getElementById(i);};
const esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
const t=function(k,v){ let s=T[S.lang][k]||T.it[k]||k; if(v) for(const x in v) s=s.split("{"+x+"}").join(v[x]); return s; };
const nomeCat=function(id){ const c=CAT.find(function(x){return x.id===id;}); return c?(c[S.lang]||c.it):id; };
const nomeTipo=function(id){ const x=TIPI[id]; return x?(x[S.lang]||x.it):id; };
const svg=function(id,s){ s=s||22; return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(ICONE[id]||ICONE.robot)+'</svg>'; };
const oggi=function(){return new Date().toISOString().slice(0,10);};
const fraMesi=function(m){ const d=new Date(); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); };
const giorniA=function(iso){return Math.round((new Date(iso+"T12:00:00")-new Date(oggi()+"T12:00:00"))/864e5);};

function link(parte){
  const m=MERCATI[S.lang]||MERCATI.it;
  const q=parte.full+(parte.xl?" "+parte.xl:"");
  return "https://"+m.host+"/s?k="+encodeURIComponent(q)+"&tag="+m.tag;
}
const valuta=function(p){ const m=MERCATI[S.lang]||MERCATI.it; return p+" "+m.val; };

function trova(q){
  const s=q.toLowerCase().trim().replace(/[^\w\s.-]/g," ").replace(/\s+/g," ");
  if(s.length<2) return [];
  const parole=s.split(" ").filter(function(w){return w.length>1;});
  return MODELLI.map(function(m){
    const testo=(m.marca+" "+m.nome+" "+m.alias+" "+nomeCat(m.cat)).toLowerCase();
    let punti=0;
    for(const w of parole){ if(testo.indexOf(w)>=0) punti+= (w.length>3?2:1); }
    const compatto=testo.replace(/[\s-]/g,"");
    for(const w of parole){ if(w.length>3 && compatto.indexOf(w.replace(/-/g,""))>=0) punti+=2; }
    return {m:m,punti:punti};
  }).filter(function(x){return x.punti>=2;}).sort(function(a,b){return b.punti-a.punti;}).slice(0,8).map(function(x){return x.m;});
}

function render(){
  el("hd").innerHTML=testata();
  el("bd").innerHTML=
      S.vista==="miei"    ? vistaMiei()
    : S.mod              ? vistaParti()
    : S.cat              ? vistaModelli()
    : vistaHome();
  el("tabs").innerHTML=barra();
  const k=S.vista+(S.cat||"")+(S.marca||"")+(S.mod||"");
  if(k!==render.k){ render.k=k; el("bd").scrollTop=0; }
}

function testata(){
  const dietro = S.vista==="home" && (S.mod||S.cat);
  return (dietro?'<button type="button" class="hd__b" id="back" aria-label="'+esc(t("indietro"))+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>'
    :'<div class="hd__b" style="background:var(--brand-grad);border:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h6v12H3z"/><path d="M9 9h12"/><path d="M9 15h12"/><path d="M18 6v3"/><path d="M18 15v3"/></svg></div>')
    +'<div class="hd__t"><div class="hd__n">Calibro <b>AI</b></div></div>'
    +'<div class="lang"><button type="button" id="linguaApri" aria-haspopup="listbox" aria-expanded="'+(!!S.linguaAperta)+'">'

    +'</div>'
    +campanella_bottone();
}

function campanella_bottone(){
  const n=S.miei.filter(function(m){return giorniA(m.quando)<=0;}).length;
  return '<button type="button" class="camp" data-tab="'+(S.vista==="miei"?"home":"miei")+'" '
    +'aria-pressed="'+(S.vista==="miei")+'" aria-label="'+esc(t("tabMiei"))+'">'
    +'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>'
    +(n?'<span class="n">'+n+'</span>':"")+'</button>';
}

      +'<div class="gesto"><button type="button" class="mic" id="voce2" aria-label="'+esc(t("parla"))+'">'
      +'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v5"/></svg>'
      +'</button><span class="gesto__n">'+esc(t("parla"))+'</span></div>')
    +(S.cerca.trim().length>=2
      ? (ris.length?'<div style="margin-top:14px">'+ris.map(rigaModello).join("")+'</div>'
                   :'<div class="empty">'+esc(t("nores"))+'</div>')
      : '<div class="grid">'+CAT.map(schedaCat).join("")+'</div>'
        +'<div class="why" style="margin-top:16px">'+t("why")+'</div>')
    +'<p class="foot">'+esc(t("disc"))+'<br><br>'+esc(t("fam"))+'</p>'
    +'</div>';
}

function schedaCat(c){
  return '<button type="button" class="cat" data-cat="'+c.id+'">'
    +'<span class="cat__i">'+svg(c.id,20)+'</span>'
    +'<span class="cat__n">'+esc(nomeCat(c.id))+'</span></button>';
}

function rigaModello(m){
  return '<button type="button" class="row" data-mod="'+esc(m.marca+"|"+m.nome)+'">'
    +'<span class="hd__b" style="width:38px;height:38px;border-radius:11px">'+svg(m.cat,19)+'</span>'
    +'<span class="row__b"><span class="row__n">'+esc(m.marca)+' '+esc(m.nome)+'</span>'
    +'<span class="row__m">'+esc(nomeCat(m.cat))+' · '+m.parti.length+' '+esc(m.parti.length===1?t("pz1"):t("pzN"))+'</span></span>'
    +'<span class="row__a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>'
    +'</button>';
}

function vistaModelli(){
  const dellaCat=MODELLI.filter(function(m){return m.cat===S.cat;});
  const marche=[...new Set(dellaCat.map(function(m){return m.marca;}))];
  const marca=S.marca&&marche.indexOf(S.marca)>=0?S.marca:null;
  const elenco=marca?dellaCat.filter(function(m){return m.marca===marca;}):dellaCat;
  return '<div class="pane">'
    +'<span class="kick">'+esc(nomeCat(S.cat))+'</span>'
    +'<h2>'+esc(marca?t("scegliModello"):t("scegliMarca"))+'</h2>'
    +'<div style="height:16px"></div>'
    +'<div class="chips">'+marche.map(function(b){return '<button type="button" data-marca="'+esc(b)+'" aria-pressed="'+(b===marca)+'">'+esc(b)+'</button>';}).join("")+'</div>'
    +elenco.map(rigaModello).join("")
    +'<p class="foot">'+esc(t("disc"))+'</p>'
    +'</div>';
}

function vistaParti(){
  const m=MODELLI.find(function(x){return x.marca+"|"+x.nome===S.mod;});
  if(!m) return '<div class="empty">—</div>';
  return '<div class="pane">'
    +'<div class="obj">'
    +'<div class="obj__m">'+esc(nomeCat(m.cat))+' · '+esc(m.marca)+'</div>'
    +'<div class="obj__n">'+esc(m.nome)+'</div>'
    +'<div class="obj__x">'+m.parti.length+' '+esc(m.parti.length===1?t("pz1"):t("pzN"))+'</div>'
    +'</div>'
    +'<span class="lbl">'+esc(t("serve"))+'</span>'
    +m.parti.map(function(p,i){return schedaParte(m,p,i);}).join("")
    +'<p class="foot">'+esc(t("disc"))+'</p>'
    +'</div>';
}

function schedaParte(m,p,i){
  const chiave=S.mod+"#"+i;
  const salvato=S.miei.some(function(x){return x.k===chiave;});
  return '<div class="pc">'
    +'<div class="pc__h"><div class="pc__i">'+svg(ICOTIPO[p.t]||"robot",21)+'</div>'
    +'<div class="pc__t"><div class="pc__n">'+esc(nomeTipo(p.t))+'</div>'
    +'<div class="pc__w">'+esc(t("ogni",{n:p.mesi}))+'</div></div></div>'
    +'<span class="code"><b>'+esc(p.full)+'</b>'+(p.xl?'<br>'+esc(p.xl):"")+'</span>'
    +'<div class="fit"><span></span>'+esc(t("combacia"))+'</div>'
    +'<div class="pc__b">'
    +'<a class="buy" href="'+esc(link(p))+'" target="_blank" rel="noopener nofollow sponsored">'+esc(t("compra"))
    +'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg></a>'
    +'<button type="button" class="bell" data-bell="'+esc(chiave)+'" aria-pressed="'+salvato+'" aria-label="promemoria">'
    +'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>'
    +'</div>'
    +'<div class="price">'+esc(t("indicativo",{p:valuta(p.p)}))+'</div>'
    +'</div>';
}

function vistaMiei(){
  if(!S.miei.length) return '<div class="pane"><h2>'+esc(t("mieiT"))+'</h2><div class="empty" style="margin-top:20px"><b>'+esc(t("mieiV"))+'</b>'+esc(t("mieiVp"))+'</div></div>';
  const ord=S.miei.slice().sort(function(a,b){return String(a.quando).localeCompare(String(b.quando));});
  return '<div class="pane"><h2>'+esc(t("mieiT"))+'</h2><div style="height:16px"></div>'
    +ord.map(function(x){
      const m=MODELLI.find(function(y){return y.marca+"|"+y.nome===x.mod;});
      const p=m&&m.parti[x.i];
      if(!p) return "";
      const g=giorniA(x.quando);
      const cls=g<0?"now":g<=21?"due":"far";
      const testo=g<0?t("scaduto"):g===0?t("oggi"):t("scade",{n:g});
      return '<div class="mine"><div class="mine__h"><div class="mine__n">'+esc(p.full)+'</div>'
        +'<div class="mine__d '+cls+'">'+esc(testo)+'</div></div>'
        +'<div class="mine__p">'+esc(x.mod.split("|").join(" "))+'</div>'
        +'<div style="height:11px"></div>'
        +'<div class="pc__b">'
        +'<a class="buy" style="min-height:44px;font-size:14px" href="'+esc(link(p))+'" target="_blank" rel="noopener nofollow sponsored">'+esc(t("compra"))+'</a>'
        +'<button type="button" class="bell" style="width:auto;padding:0 15px;font-size:13.5px;min-height:44px" data-tolgo="'+esc(x.k)+'">'+esc(t("tolgo"))+'</button>'
        +'</div></div>';
    }).join("")
    +'<p class="foot">'+esc(t("disc"))+'</p></div>';
}

document.addEventListener("click",function(e){
  const q=function(s){return e.target.closest(s);};
  let h;
  if(q("#linguaApri")){ S.linguaAperta=!S.linguaAperta; return render(); }
  if((h=q("[data-lang]"))){ S.lang=h.dataset.lang; S.linguaAperta=false; salva(); return render(); }
  if(S.linguaAperta && !q(".lang")){ S.linguaAperta=false; render(); }
  if((h=q("[data-tab]"))){
    const v=h.dataset.tab;
    if(v==="miei"){ S.vista="miei"; }
    else { S.vista="home"; S.cat=null; S.marca=null; S.mod=null; S.cerca=""; }
    return render();
  }
  if(q("#back")){
    if(S.mod){ S.mod=null; }
    else if(S.cat){ if(S.marca) S.marca=null; else S.cat=null; }
    return render();
  }
  if((h=q("[data-cat]"))){ S.cat=h.dataset.cat; S.marca=null; S.mod=null; return render(); }
  if((h=q("[data-marca]"))){ S.marca=S.marca===h.dataset.marca?null:h.dataset.marca; return render(); }
  if((h=q("[data-mod]"))){ S.mod=h.dataset.mod; return render(); }
  if((h=q("[data-bell]"))) return campanella(h.dataset.bell);
  if((h=q("[data-tolgo]"))){ S.miei=S.miei.filter(function(x){return x.k!==h.dataset.tolgo;}); salva(); return render(); }
  if(q("#voce")||q("#voce2")) return voce();
});

function campanella(chiave){
  const i=S.miei.findIndex(function(x){return x.k===chiave;});
  if(i>=0){ S.miei.splice(i,1); salva(); return render(); }
  const parti=chiave.split("#"); const mod=parti[0]; const idx=parti[1];
  const m=MODELLI.find(function(x){return x.marca+"|"+x.nome===mod;});
  const p=m&&m.parti[+idx];
  if(!p) return;
  S.miei.push({k:chiave, mod:mod, i:+idx, quando:fraMesi(p.mesi)});
  salva(); render();
}

document.addEventListener("input",function(e){
  if(e.target.id!=="q") return;
  S.cerca=e.target.value;
  const sr=document.querySelector(".sr");
  let n=sr.nextElementSibling;
  const nuovo=document.createElement("div");
  if(S.cerca.trim().length>=2){
    const ris=trova(S.cerca);
    nuovo.innerHTML=ris.length?ris.map(rigaModello).join(""):'<div class="empty">'+esc(t("nores"))+'</div>';
    nuovo.style.marginTop="14px";
  }else{
    nuovo.className="grid";
    nuovo.innerHTML=CAT.map(schedaCat).join("");
  }
  if(n) n.replaceWith(nuovo);
  const why=document.querySelector(".why");
  if(why) why.hidden=S.cerca.trim().length>=2;
});

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="q"){ e.preventDefault(); e.target.blur(); }
});

function voce(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){ const c=el("q"); if(c) c.focus(); return; }
  try{
    const r=new R();
    r.lang={it:"it-IT",en:"en-GB",de:"de-DE",fr:"fr-FR",es:"es-ES"}[S.lang]||"it-IT";
    r.interimResults=false; r.maxAlternatives=1;
    r.onresult=function(ev){
      const testo=ev.results[0][0].transcript;
      S.cerca=testo; render(); const c=el("q"); if(c) c.value=testo;
    };
    r.start();
  }catch(e){ const c=el("q"); if(c) c.focus(); }
}

if(window.visualViewport){
  visualViewport.addEventListener("resize",function(){
    const a=document.activeElement;
    if(a&&a.id==="q") setTimeout(function(){a.scrollIntoView({block:"center",behavior:"smooth"});},120);
  });
}

carica();
render();
el("sp-c").textContent=t("claim");
setTimeout(function(){el("splash").classList.add("via");},1150);
</script>

</body>
</html>
